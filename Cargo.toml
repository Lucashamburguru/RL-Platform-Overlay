[package]
name = "rl-platform-overlay"
version = "0.1.29"
edition = "2024"

[dependencies]
eframe = "0.31.0"
egui = "0.31.0"
egui_extras = { version = "0.31.0", features = ["image"] }
image = { version = "0.25", features = ["png"] }
tokio = { version = "1.44.2", features = ["full"] }
tokio-tungstenite = "0.26.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rdev = "0.5.3"
arc-swap = "1.7"
futures-util = "0.3"
toml = "0.8"
raw-window-handle = "0.6"
wreq = { version = "5.3", features = ["multipart"] }
wreq-util = "2.2"
urlencoding = "2.1.3"
sysinfo = "0.36.1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"
ed25519-dalek = "2.2"
rusqlite = { version = "0.32", features = ["bundled"] }


[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["windef", "winuser", "dwmapi", "winbase", "uxtheme"] }
gilrs = { version = "0.11.0", default-features = false, features = ["xinput"] }

[target.'cfg(not(windows))'.dependencies]
gilrs = { version = "0.11.0" }
