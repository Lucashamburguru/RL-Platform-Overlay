name: Build and Release

on:
  push:
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: rl-platform-overlay-linux
            binary_path: target/release/rl-platform-overlay
          - os: windows-latest
            artifact_name: rl-platform-overlay-windows.exe
            binary_path: target/release/rl-platform-overlay.exe

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libx11-dev \
          libxext-dev \
          libxcursor-dev \
          libxinerama-dev \
          libxi-dev \
          libxrandr-dev \
          libxtst-dev \
          libxrender-dev \
          libxss-dev \
          libxkbcommon-dev \
          libwayland-dev \
          libdbus-1-dev \
          libasound2-dev \
          libudev-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxcb-render0-dev \
          libfontconfig1-dev \
          libfreetype6-dev

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: cargo build --release

    - name: Generate checksum (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sha256sum "${{ matrix.binary_path }}" > "${{ matrix.binary_path }}.sha256"

    - name: Generate checksum (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $hash = (Get-FileHash "${{ matrix.binary_path }}" -Algorithm SHA256).Hash.ToLower()
        $name = Split-Path "${{ matrix.binary_path }}" -Leaf
        "$hash  $name" | Out-File -FilePath "${{ matrix.binary_path }}.sha256" -Encoding ascii

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          ${{ matrix.binary_path }}
          ${{ matrix.binary_path }}.sha256

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ matrix.binary_path }}
          ${{ matrix.binary_path }}.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
