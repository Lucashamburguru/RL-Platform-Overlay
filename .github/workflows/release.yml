name: Build and Release

on:
  push:
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    # Temporary transitive exceptions documented in docs/security-advisories.md.
    - name: Audit Rust dependencies
      uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195

  build:
    name: Build on ${{ matrix.os }}
    needs: audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: rl-platform-overlay-linux
            binary_path: target/release/rl-platform-overlay
          - os: windows-latest
            artifact_name: rl-platform-overlay-windows.exe
            binary_path: target/release/rl-platform-overlay.exe

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libx11-dev \
          libxext-dev \
          libxcursor-dev \
          libxinerama-dev \
          libxi-dev \
          libxrandr-dev \
          libxtst-dev \
          libxrender-dev \
          libxss-dev \
          libxkbcommon-dev \
          libwayland-dev \
          libdbus-1-dev \
          libasound2-dev \
          libudev-dev \
          libxcb-shape0-dev \
          libxcb-xfixes0-dev \
          libxcb-render0-dev \
          libfontconfig1-dev \
          libfreetype6-dev

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      with:
        toolchain: 1.98.0
        components: clippy, rustfmt

    - name: Run canonical checks
      shell: bash
      run: ./check_all.sh

    - name: Build
      run: cargo build --locked --release

    - name: Generate checksum (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sha256sum "${{ matrix.binary_path }}" > "${{ matrix.binary_path }}.sha256"

    - name: Generate checksum (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $hash = (Get-FileHash "${{ matrix.binary_path }}" -Algorithm SHA256).Hash.ToLower()
        $name = Split-Path "${{ matrix.binary_path }}" -Leaf
        "$hash  $name" | Out-File -FilePath "${{ matrix.binary_path }}.sha256" -Encoding ascii

    - name: Sign release asset
      env:
        RL_OVERLAY_RELEASE_SIGNING_KEY_B64: ${{ secrets.RL_OVERLAY_RELEASE_SIGNING_KEY_B64 }}
      run: cargo run --locked --release --bin sign_update -- --asset "${{ matrix.binary_path }}" --out "${{ matrix.binary_path }}.sig"

    - name: Upload Artifact
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          ${{ matrix.binary_path }}
          ${{ matrix.binary_path }}.sha256
          ${{ matrix.binary_path }}.sig

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Download release artifacts
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        path: release-assets
        merge-multiple: true

    - name: Prepare release notes from changelog
      shell: bash
      run: |
        version="${GITHUB_REF_NAME#v}"
        {
          echo "## What's new in ${GITHUB_REF_NAME}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" {
              found = 1
              next
            }
            found && /^---$/ {
              exit
            }
            found {
              print
            }
          ' CHANGELOG.md
        } > release-notes.md
        grep -q '^### ' release-notes.md

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        body_path: release-notes.md
        files: release-assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
